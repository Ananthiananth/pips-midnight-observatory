<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pip’s Midnight Observatory — The Complete Dreamy World</title>
    <meta name="description" content="Step into Pip's magical midnight observatory to explore 50 dreamy adventures, create personalized 1-minute dream videos, enjoy 25 full multilingual bedtime stories, and write in your dream journal." />
    <meta property="og:title" content="Pip’s Midnight Observatory — The Complete Dreamy World" />
    <meta property="og:description" content="A magical, interactive dream world for bedtime stories, 50 dream choices, custom 1-minute video generator, and star observatory." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('pip-theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'dark';
          document.documentElement.classList.remove('light', 'dark');
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased selection:bg-purple-300 selection:text-purple-950">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
